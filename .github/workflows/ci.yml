name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    # Classify changed paths so docs-only PRs skip the code suites.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4.4.0
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE"...HEAD | grep -qvE '^(docs/|.*\.md$|\.agents/|\.claude/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4.4.0
        with: { node-version: 22 }
      - run: make check-docs

  code:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.4.0
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v4.4.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: make check-code
      - run: make test

  # The only required status check in branch protection. Passes when every needed job passed or was skipped.
  gate:
    if: always()
    needs: [docs, code]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "gate failed"; exit 1 ;; esac
          done
