# Installed as .github/workflows/preview.yml; the same file is kept in docs/guides/cloudflare/preview.yml, so change both (docs/guides/migrate-to-cloudflare.md).
# One preview per pull request from a branch of this repository (never a fork's), deleted when the pull request closes.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.4.0
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v4.4.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run site:build
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 3

  preview:
    needs: build
    if: vars.SITE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4.4.0
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4.3.0
        with:
          name: site
          path: dist
      - uses: actions/setup-node@v4.4.0
        with: { node-version-file: .nvmrc }
      # This job reads the pull request's own wrangler.jsonc and holds the Cloudflare token, so it runs only for
      # branches of this repository (see the job's condition), never for forks.
      - id: preview
        run: |
          set -o pipefail
          output="$(npx --yes wrangler@4.165.0 preview --name "pr-${PR}" --json)"
          printf '%s\n' "$output"
          echo "url=$(printf '%s' "$output" | jq -er '.preview.urls[0]')" >> "$GITHUB_OUTPUT"
        env:
          PR: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The address is checked against the old site's links before anyone reads the preview.
      - run: node scripts/parity.mjs "$URL"
        env:
          URL: ${{ steps.preview.outputs.url }}
      - run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Preview: $URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && vars.SITE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare
    steps:
      - uses: actions/setup-node@v4.4.0
        with: { node-version: 22 }
      - run: npx --yes wrangler@4.165.0 preview delete --name "pr-${PR}" --skip-confirmation
        env:
          PR: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
