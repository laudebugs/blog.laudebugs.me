<style>
  /* Layout: a sticky toolbar (page, then code block style) over one stage in the settled look: Orchid colours, Lora, graph paper, every corner square. */
  :root { --chrome-bg: #1c1a24; --chrome-fg: #f1edf8; --chrome-dim: #a79fbb; --chrome-hi: #d9ccf5; color-scheme: light; }
  * { box-sizing: border-box; border-radius: 0 !important; }
  html, body { margin: 0; }
  body { background: #e9e6f0; font-family: 'Figtree', system-ui, sans-serif; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--chrome-bg); z-index: 60; }
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--chrome-bg); color: var(--chrome-fg); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; }
  .bar .group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .bar .lbl { font: 400 11px 'DM Mono', monospace; color: var(--chrome-dim); text-transform: uppercase; letter-spacing: .1em; width: 44px; }
  .bar button { font: 500 12.5px 'DM Mono', monospace; color: var(--chrome-dim); background: transparent; border: 1px solid #3b3748; padding: 6px 10px; cursor: pointer; min-height: 34px; }
  .bar button[aria-pressed="true"] { background: var(--chrome-hi); color: #1c1a24; border-color: var(--chrome-hi); }
  .bar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .blurb { padding: 12px max(16px, env(safe-area-inset-left, 0px)); background: #f6f4fa; color: #24202f; font: 400 14.5px/1.5 'Figtree', sans-serif; border-bottom: 1px solid #d6d0e3; }
  .blurb p { margin: 0 auto; max-width: 1060px; }
  pre { margin: 0; }

  /* ---------- the site ---------- */
  .nb { --paper: #fdf5fc; --grid: #f1dcf0; --ink: #2b1530; --dim: #7a5a80; --accent: #9a3fc4; --mark: #ffd6ec; --panel: #ffffff;
    --a: #d9ccf5; --a2: #6b4fc0; --b: #ffd3be; --b2: #b2502a; --c: #c8ebdd; --c2: #1f7a5a; --d: #bedcf5; --d2: #2a6fa8; --g: 16px;
    --onacc: #ffffff; --scrim: color-mix(in srgb, var(--ink) 32%, transparent); --hf: 'Lora', Georgia, serif;
    background-color: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: var(--g) var(--g);
    color: var(--ink); font-family: var(--hf); min-height: 100vh; position: relative; overflow: hidden; }
  .nb .wrap { position: relative; max-width: 1060px; margin: 0 auto; padding: 0 max(20px, env(safe-area-inset-left, 0px)) 40px; }
  .nb.dark { --paper: #17112b; --grid: #261e44; --ink: #f0eaff; --dim: #a99dc9; --accent: #c78bf0; --mark: #4b2f78; --panel: #211a3b; --a: #3a2d73; --a2: #b9a2ff; --b: #5a3322; --b2: #ff9d78; --c: #1d4437; --c2: #6fd6a8; --d: #233f66; --d2: #7ebcff; --onacc: #17112b; --scrim: rgba(5, 2, 14, .62); color-scheme: dark; }
  .nb.dark .blob { opacity: .5; }
  .nb.dark .cover, .nb.dark .feat img { filter: brightness(.88) saturate(.95); }
  .nb .veil { background: color-mix(in srgb, var(--paper) 90%, transparent); }
  .nb header.top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 10px 24px; padding: 28px 0 18px; border-bottom: 2px solid var(--ink); }
  .nb .mono { font: 400 .8rem 'DM Mono', monospace; letter-spacing: .02em; }
  .nb .brand { font: 600 1.5rem var(--hf); letter-spacing: -.01em; }
  .nb .brand i, .nb h1 em { color: var(--accent); font-style: italic; font-weight: 400; }
  .nb nav { display: flex; gap: 20px; flex-wrap: wrap; }
  .nb nav .on { color: var(--accent); text-decoration: underline; text-underline-offset: 5px; }
  .nb h1 { font: 500 clamp(2.2rem, 5.6vw, 3.9rem)/1.04 var(--hf); letter-spacing: -.02em; margin: 38px 0 12px; text-wrap: balance; }
  .nb .lede { font-size: 1.2rem; line-height: 1.45; color: var(--dim); max-width: 52ch; margin: 0 0 32px; }
  .nb .feat { display: grid; grid-template-columns: 1fr 260px; gap: 28px; padding: 22px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .nb .feat h2 { font: 500 2rem/1.12 var(--hf); margin: 8px 0 10px; letter-spacing: -.015em; }
  .nb .feat img { width: 100%; height: 100%; max-height: 190px; object-fit: cover; }
  .nb .row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 190px; gap: 20px; padding: 15px 0; border-bottom: 1px solid var(--grid); align-items: baseline; }
  .nb .row b { font: 500 1.22rem/1.28 var(--hf); }
  .nb .row:hover b { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
  .nb .year { font: 500 .8rem 'DM Mono', monospace; padding: 24px 0 6px; color: var(--accent); letter-spacing: .1em; display: flex; justify-content: space-between; }
  .nb .tag { color: var(--dim); }
  .nb .more { display: inline-block; margin-top: 22px; font: 500 .85rem 'DM Mono', monospace; color: var(--a2); padding: 9px 16px; background: color-mix(in srgb, var(--a) 65%, transparent); }
  .nb .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 6px; }
  .nb .chip { font: 400 .78rem 'DM Mono', monospace; color: var(--a2); padding: 4px 10px; background: color-mix(in srgb, var(--a) 65%, transparent); }
  .nb .chip b { font-weight: 500; }
  .nb .tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin-bottom: 28px; }
  .nb .tcard { color: var(--t); padding: 16px 18px; background: color-mix(in srgb, var(--t) 13%, var(--paper)); }
  .nb .tcard h3 { font: 500 1.5rem/1.1 var(--hf); margin: 0 0 4px; display: flex; justify-content: space-between; align-items: baseline; }
  .nb .tcard h3 span { font: 400 .78rem 'DM Mono', monospace; }
  .nb .tcard p { margin: 8px 0 0; font-size: .98rem; line-height: 1.35; color: var(--ink); opacity: .75; }
  .nb .t1 { --t: var(--a2); } .nb .t2 { --t: var(--b2); } .nb .t3 { --t: var(--c2); } .nb .t4 { --t: var(--d2); }

  /* article: text on a white panel */
  .nb .art { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 28px; padding-top: 24px; align-items: start; }
  .nb .sheet { background: var(--panel); padding: 38px 44px 28px; }
  .nb .sheet h1 { font-size: clamp(2rem, 4.6vw, 2.9rem); margin: 6px 0 8px; }
  .nb .by { font-size: 1.05rem; color: var(--dim); margin: 0 0 18px; } .nb .by u { text-decoration-style: dotted; text-underline-offset: 4px; }
  .nb .cover { width: 100%; height: 130px; object-fit: cover; display: block; }
  .nb .credit { font: 400 .75rem 'DM Mono', monospace; color: var(--dim); text-align: center; margin: 6px 0 20px; }
  .nb .prose { font-size: var(--ps, 1.2rem); line-height: var(--lh, 1.68); }
  .nb .prose p { margin: 0 0 1.1em; }
  .nb .prose h2 { font: 600 1.55rem/1.2 var(--hf); margin: 1.8em 0 .5em; }
  .nb .prose a { color: var(--a2); text-underline-offset: 3px; }
  .nb code.in { font: 400 .78em 'DM Mono', monospace; background: color-mix(in srgb, var(--a) 60%, transparent); padding: 2px 6px; }
  .nb .toc { position: sticky; top: 130px; font-size: .95rem; line-height: 1.4; padding-left: 4px; }
  .nb .toc b { display: block; font: 500 .72rem 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  .nb .toc span { display: block; color: var(--dim); margin-bottom: 8px; } .nb .toc span.on { color: var(--accent); }

  /* code blocks: four styles, all square, none with a shadow */
  .cb { position: relative; margin: 1.4rem 0 1.8rem; font: 400 .86rem/1.65 'DM Mono', monospace; color: var(--ink); }
  .cb .lbl { font: 400 .72rem 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .06em; }
  .cb .copy { font: 500 .72rem 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .06em; background: none; border: 0; color: inherit; cursor: pointer; padding: 6px 4px; }
  .cb .copy:focus-visible { outline: 3px solid currentColor; outline-offset: 2px; }
  .cb pre { padding: 16px 18px; overflow-x: auto; tab-size: 4; }
  .cb .ln { display: block; margin: 0 -18px; padding: 0 18px; }
  .cb .hl { background: var(--mark); }
  .cb .dim { opacity: .38; }
  .cb .errband { display: block; margin: 0 -18px; padding: 2px 18px; background: color-mix(in srgb, var(--b) 55%, transparent); color: var(--b2); white-space: normal; }
  .k { color: var(--a2); font-weight: 500; } .s { color: var(--c2); } .t { color: var(--d2); } .n { color: var(--b2); } .c { color: var(--dim); font-style: italic; } .p { opacity: .72; }
  .nb .callout { margin: 1.3rem 0 1.7rem; padding: 14px 18px 15px; font-size: 1.05rem; line-height: 1.55; color: var(--ink); background: color-mix(in srgb, var(--t, var(--d2)) 13%, var(--panel)); }
  .nb .callout b { display: block; margin-bottom: 4px; font: 500 .72rem 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--t, var(--d2)); }
  .nb .callout.note { --t: var(--d2); } .nb .callout.tip { --t: var(--c2); } .nb .callout.warn { --t: var(--b2); }
  .st-a .cb { border: 2px solid var(--tone, var(--d2)); margin-top: 1.8rem; }
  .st-a .cb .lbl { position: absolute; top: -.8em; left: 14px; background: var(--panel); color: var(--tone, var(--d2)); padding: 0 8px; }
  .st-a .cb .copy { position: absolute; top: -.9em; right: 12px; background: var(--panel); color: var(--tone, var(--d2)); padding: 0 8px; }
  .st-b .cb { background: color-mix(in srgb, var(--a) 55%, transparent); }
  .st-b .cb .head { display: flex; justify-content: space-between; align-items: center; padding: 8px 18px 0; color: var(--a2); }
  .st-b .cb pre { padding-top: 8px; }
  .st-c .cb { border: 2px solid var(--a2); }
  .st-c .cb .head { display: flex; justify-content: space-between; align-items: center; padding: 5px 16px; border-bottom: 2px solid var(--a2); color: var(--a2); }
  .st-c .cb .lang { border: 1.5px solid var(--a2); padding: 0 7px; font: 400 .68rem 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .06em; margin-right: 10px; }
  .st-d .cb { border: 2px solid var(--tone, var(--d2)); }
  .st-d .cb .head { display: flex; justify-content: space-between; align-items: center; padding: 8px 18px 0; color: var(--tone, var(--d2)); }
  .st-d .cb pre { padding-top: 6px; }
  .tn-html { --tone: var(--d2); } .tn-ts { --tone: var(--a2); } .tn-sh { --tone: var(--c2); }
  .st-a .tn-ts, .st-a .tn-sh { --tone: var(--d2); } .st-c .cb, .st-b .cb { --tone: var(--a2); }

  /* live example */
  .live { margin: 1.4rem 0 1.8rem; font: 400 .86rem/1.6 'DM Mono', monospace; color: var(--a2); background: color-mix(in srgb, var(--a) 55%, transparent); }
  .live .cap { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 16px; font: 400 .72rem 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .06em; }
  .live .cap.b { border-top: 1px solid color-mix(in srgb, var(--a2) 30%, transparent); }
  .live textarea { display: block; width: 100%; min-height: 190px; resize: vertical; border: 0; outline: 0; padding: 14px 18px; background: transparent; color: var(--ink); font: 400 .86rem/1.65 'DM Mono', monospace; white-space: pre; overflow: auto; }
  .live textarea:focus-visible { outline: 3px solid var(--a2); outline-offset: -3px; }

  .nb .pn { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 30px 0 10px; }
  .nb .pn div { color: var(--a2); padding: 14px 16px; font: 500 1.05rem/1.3 var(--hf); background: color-mix(in srgb, var(--a) 55%, transparent); }
  .nb .pn small { display: block; font: 400 .72rem 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .nb .pn div span { color: var(--ink); }
  .nb footer { margin-top: 56px; padding: 18px 0 8px; border-top: 2px solid var(--ink); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; color: var(--dim); }
  .nb .blob { position: absolute; border-radius: 50%; filter: blur(34px); opacity: .6; pointer-events: none; }
  .nb .scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 5; }
  .nb .modal { position: absolute; z-index: 6; left: 50%; top: 150px; transform: translateX(-50%); width: min(640px, calc(100% - 32px)); background: var(--panel); }
  .nb .modal .q { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--grid); font: 400 1.15rem var(--hf); }
  .nb .modal .q kbd { margin-left: auto; font: 400 .72rem 'DM Mono', monospace; background: color-mix(in srgb, var(--a) 65%, transparent); color: var(--a2); padding: 2px 7px; }
  .nb .res { padding: 12px 16px; border-bottom: 1px solid var(--grid); }
  .nb .res b { font: 500 1.1rem/1.25 var(--hf); display: block; }
  .nb .res p { margin: 4px 0 0; font-size: .92rem; line-height: 1.4; color: var(--dim); }
  .nb .res.on { background: color-mix(in srgb, var(--a) 55%, transparent); }
  .nb mark { background: var(--mark); color: inherit; padding: 0 2px; }
  .nb .nf { padding-top: 30px; }
  .nb .nf .big { font: 500 clamp(5rem, 16vw, 11rem)/.9 var(--hf); color: var(--accent); letter-spacing: -.04em; }
  @media (max-width: 860px) { .nb .art { grid-template-columns: minmax(0, 1fr); } .nb .toc { display: none; } .nb .row { grid-template-columns: 1fr; gap: 4px; } .nb .feat { grid-template-columns: 1fr; } .nb .pn { grid-template-columns: 1fr; } .nb .modal { top: 90px; } .nb .sheet { padding: 24px 18px 12px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  function blobsOld() { return '<div class="blob" style="width:520px;height:520px;background:var(--a);right:-160px;top:-120px"></div><div class="blob" style="width:340px;height:340px;background:var(--c);left:-110px;top:420px"></div><div class="blob" style="width:420px;height:420px;background:var(--b);right:-120px;top:900px"></div>'; }
  function shell(inner, on) {
    var nav = ['archive', 'topics'].map(function (n) { return '<span' + (on === n ? ' class="on"' : '') + '>' + n + '</span>'; }).join('');
    return '<div id="nb" class="nb st-' + state.s + (state.t === 'dark' ? ' dark' : '') + '">' + blobs() + '<div class="wrap"><header class="top"><span class="brand">Laurence Ininda <i>/ blog</i></span><nav class="mono">' + nav + '<span>search /</span><span>laudebugs.me ↗</span><span>github ↗</span></nav></header>' + inner +
      '<footer class="mono"><span>© Laurence Ininda</span><span>RSS · Markdown · llms.txt</span><span>Edit on GitHub ↗</span></footer></div></div>';
  }
  function cb(tn, label, lang, lines) {
    var copy = '<button class="copy" type="button" data-copy>Copy</button>', s = state.s, head = '';
    if (s === 'a') head = '<span class="lbl">' + label + '</span>' + copy;
    else if (s === 'c') head = '<div class="head"><span class="lbl">' + label + '</span><span><span class="lang">' + lang + '</span>' + copy + '</span></div>';
    else head = '<div class="head"><span class="lbl">' + label + '</span>' + copy + '</div>';
    var body = lines.map(function (l) {
      if (l[0] === 'e') return '<span class="errband">' + l[1] + '</span>';
      return '<span class="ln' + (l[0] === 'h' ? ' hl' : '') + (l[0] === 'd' ? ' dim' : '') + '">' + l[1] + '</span>';
    }).join('');
    return '<div class="cb tn-' + tn + '">' + head + '<pre>' + body + '</pre></div>';
  }
  function live() {
    return '<div class="live" data-live><div class="cap t"><span>Fig. 1 · Try it</span><span style="opacity:.75">runs in your browser</span></div><textarea spellcheck="false" aria-label="Editable example code" data-code>' + esc(CODE) + '</textarea>' +
      '<div class="cap b"><span>Output</span><button class="run" type="button" data-run>Run ▸</button></div><pre class="out" aria-live="polite" data-out>Press Run to see the result.</pre></div>';
  }
  var P = function (s) { return '<span class="p">' + s + '</span>'; };
  var PAGEFN = {
    home: function () {
      var p0 = POSTS[0], rows = '', shown = 0;
      years.forEach(function (y) { var list = byYear[y].filter(function (p) { return p !== p0 && shown < 9 && ++shown; }); if (list.length) rows += '<div class="year veil"><span>' + y + '</span></div>' + list.map(row).join(''); });
      return shell('<h1>Field notes on <em>work and projects</em></h1><p class="lede veil">' + SUB + '</p>' +
        '<div class="feat veil"><div><span class="mono tag">latest · ' + fmt(p0.date, 1) + '</span><h2>' + esc(p0.title) + '</h2><p style="margin:0;color:var(--dim);font-size:1.05rem;line-height:1.45">With the cost of building a solution going down, being able to accurately define a problem is what seems more exciting.</p></div><img src="' + COVERS[p0.slug] + '" alt=""></div>' + rows +
        '<a class="more" href="#">All 21 posts →</a>', 'home');
    },
    post: function () {
      var html1 = [[0, P('&lt;') + '<span class="t">mat-tab-group</span> <span class="n">[(selectedIndex)]</span>' + P('=') + '<span class="s">"tabIndex"</span>' + P('&gt;')],
        [0, '    ' + P('&lt;') + '<span class="t">mat-tab</span> <span class="n">label</span>' + P('=') + '<span class="s">"All Posts"</span>' + P('&gt;')],
        [0, '        ' + P('&lt;') + '<span class="t">all-posts</span>' + P('/&gt;')],
        [0, '    ' + P('&lt;/') + '<span class="t">mat-tab</span>' + P('&gt;')],
        [0, '    ' + P('&lt;') + '<span class="t">mat-tab</span> <span class="n">label</span>' + P('=') + '<span class="s">"Gallery"</span>' + P('&gt;')],
        [0, '        ' + P('&lt;') + '<span class="t">gallery-view</span>' + P('/&gt;')],
        [0, '    ' + P('&lt;/') + '<span class="t">mat-tab</span>' + P('&gt;')],
        [0, P('&lt;/') + '<span class="t">mat-tab-group</span>' + P('&gt;')]];
      var html2 = [[0, '<span class="k">@if</span>' + P('(tabIndex === ') + '<span class="n">1</span>' + P(') {')],
        [0, '    ' + P('&lt;') + '<span class="t">div</span>' + P('&gt;{{ ') + 'galleryViewRef.photoCount()' + P(' }} photos&lt;/') + '<span class="t">div</span>' + P('&gt;')],
        ['e', 'Will throw error: Property \'photoCount\' does not exist on type \'undefined\'.'],
        [0, P('}')],
        ['d', P('&lt;') + '<span class="t">mat-tab-group</span> <span class="n">[(selectedIndex)]</span>' + P('=') + '<span class="s">"tabIndex"</span>' + P('&gt;')],
        ['d', '    ' + P('&lt;') + '<span class="t">mat-tab</span> <span class="n">label</span>' + P('=') + '<span class="s">"Gallery"</span>' + P('&gt;')],
        ['d', '        <span class="k">@defer</span>' + P('(') + '<span class="k">on</span> viewport' + P(') {')],
        ['h', '            ' + P('&lt;') + '<span class="t">gallery-view</span> <span class="n">#galleryViewRef</span>' + P('/&gt;')],
        ['d', '        ' + P('}')],
        ['d', '    ' + P('&lt;/') + '<span class="t">mat-tab</span>' + P('&gt;')],
        ['d', P('&lt;/') + '<span class="t">mat-tab-group</span>' + P('&gt;')]];
      var sh = [[0, '<span class="c"># add Angular Material</span>'], [0, '<span class="t">pnpm</span> add <span class="s">@angular/material</span>']];
      return shell('<div class="art"><article class="sheet"><span class="mono tag">angular</span><h1>Referencing <code class="in" style="font-size:.72em">viewChild</code> queries within <code class="in" style="font-size:.72em">@defer</code> blocks</h1>' +
        '<p class="by">by <u>Laurence Ininda</u> on January 28, 2026 · 4 min read</p><img class="cover" src="' + COVERS[main.slug] + '" alt=""><p class="credit">Photo by Kenny Eliason on Unsplash</p>' +
        '<div class="prose"><h2>A primer on @defer</h2><p>Angular\'s <code class="in">@defer</code> allows developers to delay when a component will be initialized within a component\'s template, until <a href="#">a certain condition is met</a>. In our case, we use <a href="#">Angular Material Tabs</a> with two tabs displaying two pieces of data:</p>' +
        cb('html', 'app.component.html', 'html', html1) +
        '<h2>Referencing content within @defer blocks</h2><p>To reference our <code class="in">&lt;gallery-view/&gt;</code> component and use it in the same template, we can\'t use a template reference variable:</p>' +
        cb('html', 'app.component.html', 'html', html2) +
        '<div class="callout note"><b>Note</b>The above <code class="in">galleryViewRef.photoCount()</code> will be undefined.</div>' +
        '<div class="callout tip"><b>Tip</b>Query the block with <code class="in">viewChild()</code> instead. It is a signal, so anything that reads it updates once the block renders.</div><div class="callout warn"><b>Warning</b>Reading <code class="in">galleryRef()</code> before the <code class="in">@defer</code> block has rendered returns <code class="in">undefined</code>.</div><p>Add the library, then try the idea yourself:</p>' + cb('sh', 'terminal', 'sh', sh) + live() + '</div>' +
        '<div class="chips"><span class="chip">angular</span></div>' +
        '<div class="pn"><div><small>← Previous</small><span>The gap between man and machine</span></div><div style="text-align:right"><small>Next →</small><span>Defining the Problem has always been the frontier</span></div></div></article>' +
        '<aside class="toc"><b>On this page</b><span class="on">A primer on @defer</span><span>Referencing content within @defer blocks</span><span>Fig. 1 · Try it</span><span style="margin-top:14px">Copy as Markdown</span><span>Edit on GitHub ↗</span></aside></div>', '');
    },
    archive: function () {
      var idx = years.map(function (y) { return '<span class="chip">' + y + ' <b>' + byYear[y].length + '</b></span>'; }).join('');
      var rows = years.map(function (y) { return '<div class="year veil"><span>' + y + '</span><span>' + byYear[y].length + ' posts</span></div>' + byYear[y].map(row).join(''); }).join('');
      return shell('<h1>Archive</h1><p class="lede veil">All 21 posts since 2020, newest first.</p><div class="chips" style="margin-bottom:10px">' + idx + '</div>' + rows, 'archive');
    },
    topics: function () {
      var big = topTags.slice(0, 6), small = topTags.slice(6);
      var cards = big.map(function (t, i) {
        var ps = POSTS.filter(function (p) { return p.tags.indexOf(t) > -1; }).slice(0, 2);
        return '<div class="tcard t' + ((i % 4) + 1) + '"><h3>' + t + '<span>' + tagCounts[t] + ' posts</span></h3>' + ps.map(function (p) { return '<p>' + esc(p.title) + '</p>'; }).join('') + '</div>';
      }).join('');
      var chips = small.map(function (t) { return '<span class="chip">' + t + ' <b>' + tagCounts[t] + '</b></span>'; }).join('');
      return shell('<h1>Topics</h1><p class="lede veil">' + topTags.length + ' topics. Angular is where most of the writing is.</p><div class="tcards">' + cards + '</div><div class="mono tag" style="margin:0 0 8px">more topics</div><div class="chips">' + chips + '</div>', 'topics');
    },
    topic: function () {
      var ps = POSTS.filter(function (p) { return p.tags.indexOf('angular') > -1; });
      return shell('<div class="mono tag" style="margin-top:34px">topic</div><h1 style="margin-top:6px"><em>angular</em></h1><p class="lede veil">' + ps.length + ' posts, newest first.</p>' + ps.map(row).join(''), 'topics');
    },
    search: function () {
      var hits = POSTS.filter(function (p) { return /angular/i.test(p.title) || p.tags.indexOf('angular') > -1; }).slice(0, 4);
      var inner = hits.map(function (p, i) { return '<div class="res' + (i === 0 ? ' on' : '') + '"><b>' + esc(p.title).replace(/(Angular)/gi, '<mark>$1</mark>') + '</b><p>' + fmt(p.date, 1) + ' · ' + p.tags.join(', ') + '</p></div>'; }).join('');
      return PAGEFN.home().replace('<footer', '<div class="scrim"></div><div class="modal"><div class="q"><span>⌕</span><span>angular</span><kbd>Esc</kbd></div>' + inner + '<div class="res mono tag" style="border:0">9 results · ↑↓ to move · enter to open</div></div><footer');
    },
    nf: function () {
      return shell('<div class="nf"><div class="big">404</div><h1 style="margin-top:6px">That page isn\'t in the notebook</h1><p class="lede veil">It may have moved, or the link may be wrong. Try search, the archive, or one of the latest posts.</p><div class="chips" style="margin-bottom:26px"><span class="chip"><b>/</b> search</span><span class="chip">archive</span><span class="chip">topics</span></div>' + POSTS.slice(0, 3).map(row).join('') + '</div>', '');
    }
  };

  function bind() {
    document.querySelectorAll('[data-live]').forEach(function (box) {
      box.querySelector('[data-run]').addEventListener('click', function () {
        var out = box.querySelector('[data-out]');
        try { var r = new Function(box.querySelector('[data-code]').value)(); out.textContent = typeof r === 'string' ? r : JSON.stringify(r, null, 2); } catch (e) { out.textContent = 'Error: ' + e.message; }
      });
    });
    document.querySelectorAll('[data-copy]').forEach(function (b) {
      b.addEventListener('click', function () {
        var done = function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy'; }, 1400); };
        try { navigator.clipboard.writeText(b.closest('.cb').querySelector('pre').innerText).then(done, done); } catch (e) { done(); }
      });
    });
    document.querySelectorAll('#stage a[href="#"]').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); }); });
  }
  function draw() {
    document.getElementById('stage').innerHTML = PAGEFN[state.p]();
    var ft = FONTS[state.f]; document.getElementById('blurb').innerHTML = '<b>' + ft.n + '.</b> ' + ft.d + ' &nbsp;·&nbsp; ' + BLURBS[state.p] + ' Final design: Lora, the Orchid colours, a plain graph-paper page, frosted-glass code blocks, tinted sections with no borders, every corner square.' + (state.t === 'dark' ? ' Dark: a deep purple page, lighter tones for text and borders, and the article panel turns dark purple.' : '');
    document.querySelectorAll('#pages button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.k === state.p)); });
    var nbEl = document.getElementById('nb'); if (nbEl) { nbEl.style.setProperty('--body', ft.css); nbEl.style.setProperty('--ps', ft.ps); nbEl.style.setProperty('--lh', ft.lh); }
    document.querySelectorAll('#fonts button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.k === String(state.f))); });
    document.querySelectorAll('#themes button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.k === state.t)); });
    bind();
  }
  function mk(id, items, onclick) {
    var el = document.getElementById(id);
    items.forEach(function (it) { var b = document.createElement('button'); b.type = 'button'; b.dataset.k = it[0]; b.textContent = it[1]; b.addEventListener('click', function () { onclick(it[0]); try { history.replaceState(null, '', '#' + state.p + '-b-' + state.t + '-' + state.f); } catch (e) {} draw(); }); el.appendChild(b); });
  }
  mk('pages', PAGES, function (k) { state.p = k; });
  mk('fonts', FONTS.map(function (f, i) { return [String(i), f.n]; }), function (k) { state.f = parseInt(k, 10); });
  mk('themes', [['light', 'Light'], ['dark', 'Dark']], function (k) { state.t = k; });
  var h = (location.hash || '').slice(1).split('-');
  if (PAGEFN[h[0]]) state.p = h[0]; if (h[2] === 'dark') state.t = 'dark'; var fi = parseInt(h[3], 10); if (fi >= 0 && fi < FONTS.length) state.f = fi;
  draw();
</script>
