# Install as .github/workflows/deploy.yml (a session cannot push workflow files; see docs/guides/migrate-to-cloudflare.md).
# Builds the site with no secrets, then deploys it from main with the Cloudflare secrets.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one at a time and are never cancelled half way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run site:build
        env:
          ASTRO_SITE: https://blog.laudebugs.me
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    # Switch: nothing deploys until the repository variable SITE_DEPLOY_ENABLED is "true".
    if: vars.SITE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      # The version matches the one pinned in package.json. Nothing from the repository is installed or run here:
      # this job holds the Cloudflare token.
      - run: npx --yes wrangler@4.165.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
